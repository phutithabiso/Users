
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update User</title>

    <style>
        #message {
            padding: 10px;
            margin: 15px 0;
            display: none;
            border-radius: 5px;
        }

        .success {
            display: block !important;
            background-color: #d4edda;
            color: #155724;
        }

        .error {
            display: block !important;
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

<h2>Update User</h2>

<nav>
    <a href="/add.html">Create User</a> |
    <a href="/index.html">View All Users</a> |
    <a href="/searchUser.html">View By ID</a>
</nav>

<p id="message"></p>

<form id="updateForm">

    <label>User ID:</label>
    <input type="number" id="updateId" min="1" required>

    <br><br>

    <label>Full Name:</label>
    <input type="text" id="updateName"
           minlength="2" maxlength="30" required>

    <br><br>

    <label>Email:</label>
    <input type="email" id="updateEmail" required>

    <br><br>

    <button type="submit" id="updateButton">
        Update User
    </button>

</form>

<script src="/js/script.js"></script>

</body>
</html>
